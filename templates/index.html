{% extends "base.html" %}

{% block title %}Fade &amp; Steel — Barbershop{% endblock %}

{% block content %}
{% if catalog_error %}
<div role="alert" class="border-b border-danger/40 bg-danger/10 px-4 py-3 text-center text-sm text-cream">
  {{ catalog_error }}
</div>
{% endif %}
<div id="root"></div>
{% endblock %}

{% block scripts %}
<script id="cj-bootstrap" type="application/json">{{ bootstrap|tojson }}</script>
<script>window.API_BASE_URL = {{ config.get("API_BASE_URL", "")|tojson }};</script>
<script type="text/babel" data-presets="react" src="{{ url_for('static', filename='js/app.js') }}"></script>
{% endblock %}
