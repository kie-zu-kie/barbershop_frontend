{% extends "base.html" %}

{% block title %}Admin Login - Fade & Steel{% endblock %}

{% block content %}
<div class="min-h-screen bg-charcoal-950 text-cream flex items-center justify-center px-4">
  <div class="w-full max-w-md rounded-card border border-white/10 bg-charcoal-900/80 p-8 shadow-2xl">
    <div class="mb-8 text-center">
      <div class="mb-3 flex items-center justify-center gap-2">
        <img src="{{ url_for('static', filename='images/barber-logo.png') }}" alt="" class="h-10 w-10 object-contain">
        <p class="font-display text-lg text-cream">Fade &amp; Steel</p>
      </div>
      <h1 class="mt-3 font-display text-4xl text-cream">Admin Login</h1>
    </div>

    <form class="space-y-5">
      <div>
        <label for="email" class="mb-2 block text-sm font-medium text-cream">Email</label>
        <input id="email" type="email" value="admin@fadeandsteel.com" class="w-full rounded-lg border border-white/10 bg-charcoal-800 px-4 py-3 text-cream outline-none ring-0 focus:border-gold-bright" />
      </div>

      <div>
        <label for="password" class="mb-2 block text-sm font-medium text-cream">Password</label>
        <input id="password" type="password" value="admin123" class="w-full rounded-lg border border-white/10 bg-charcoal-800 px-4 py-3 text-cream outline-none ring-0 focus:border-gold-bright" />
      </div>

      <button type="submit" class="w-full rounded-btn bg-gold px-4 py-3 font-semibold text-charcoal-950 transition hover:bg-gold-bright">
        Sign in
      </button>
    </form>

    <div class="mt-6 text-center text-sm text-cream-muted">
      <a href="{{ url_for('pages.home') }}" class="text-gold-bright underline underline-offset-4">Back to site</a>
    </div>
  </div>
</div>
{% endblock %}
