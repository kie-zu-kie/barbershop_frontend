<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Fade &amp; Steel — Barbershop{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            charcoal: { 950: '#0E1117', 900: '#171510', 800: '#211E16', 700: '#3B3223', 600: '#6B5830' },
            cream: { DEFAULT: '#EAE6DF', muted: '#C4A967', dim: '#9B8048' },
            gold: { DEFAULT: '#B59A66', bright: '#D7BE86', dim: '#897246' },
            success: '#69A387',
            pending: '#C39A56',
            danger: '#C46B63',
            neutralstatus: '#C4A967',
          },
          fontFamily: {
            display: ['Fraunces', 'serif'],
            body: ['Manrope', 'sans-serif'],
          },
          borderRadius: { card: '14px', btn: '8px' },
        }
      }
    };
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
